name: source-checks
on:
  push:
  pull_request:
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m compileall -q finetrainers train tests eval scripts
      - run: python scripts/check_release.py
